<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anything.ai</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; }
  /* iOS Safari auto-zooms into any input/select/textarea with font-size under
     16px on focus - this keeps every form control at or above that threshold. */
  input, select, textarea { font-size: 16px; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #1e1e1e; color: #ddd; display: flex; height: 100vh; }

  #sidebar { width: 220px; background: #171717; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 10px; gap: 6px; overflow-y: auto; }
  #sidebar h3 { margin: 4px 0 8px; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  .chat-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .chat-item:hover { background: #262626; }
  .chat-item.active { background: #2d5a9e; }
  .chat-item .del { opacity: 0.4; font-size: 12px; padding: 0 4px; }
  .chat-item .del:hover { opacity: 1; color: #ff6b6b; }
  #newChatBtn, #settingsBtn, #agentsBtn, #instructionsBtn { padding: 8px; border: 1px solid #444; border-radius: 6px; background: #262626; color: #ddd; cursor: pointer; text-align: left; display: block; text-decoration: none; box-sizing: border-box; }
  #newChatBtn:hover, #settingsBtn:hover, #agentsBtn:hover, #instructionsBtn:hover { background: #333; }
  #instructionsBtn { margin-top: auto; }
  #agentSelect { width: 100%; padding: 8px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; margin-bottom: 4px; }
  #sidebarModelControls { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  #sidebarModelControls .pill { width: 100%; border-radius: 6px; text-align: left; }

  #brand { font-weight: 700; font-size: 16px; padding: 4px; color: #fff; }
  #greeting { padding: 8px 4px 4px; font-size: 14px; color: #ddd; }
  #greeting .logout { display: block; margin-top: 2px; font-size: 12px; color: #888; cursor: pointer; }
  #greeting .logout:hover { color: #ccc; text-decoration: underline; }

  #main { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; padding: 1.5rem; }
  #menuToggle { display: none; background: #262626; border: 1px solid #444; color: #ddd; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; cursor: pointer; align-self: flex-start; font-size: 16px; }
  #sidebarBackdrop { display: none; }

  @media (max-width: 700px) {
    body { display: block; }
    #sidebar { position: fixed; top: 0; left: 0; height: 100%; width: 260px; z-index: 30; transform: translateX(-100%); transition: transform 0.2s ease; }
    #sidebar.open { transform: translateX(0); }
    #sidebarBackdrop.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 25; }
    #main { max-width: 100%; padding: 1rem; height: 100vh; }
    #menuToggle { display: block; }
  }
  #log { flex: 1; display: flex; flex-direction: column; gap: 12px; margin-bottom: 1rem; overflow-y: auto; }
  #emptyGreeting { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #666; }
  .msg { padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; max-width: 90%; }
  .user { background: #2d5a9e; align-self: flex-end; }
  .assistant { background: #333; align-self: flex-start; }
  .info { background: transparent; border: 1px dashed #444; color: #999; align-self: center; font-size: 13px; font-family: ui-monospace, monospace; max-width: 100%; }
  .msg-text { white-space: pre-wrap; }
  .code-block { background: #161616; border: 1px solid #333; border-radius: 8px; margin: 8px 0; overflow: hidden; }
  .code-block-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: #1e1e1e; border-bottom: 1px solid #333; font-size: 12px; color: #888; }
  .code-block-header .copy-btn { padding: 3px 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; color: #ccc; font-size: 12px; cursor: pointer; }
  .code-block-header .copy-btn:hover { background: #333; }
  .code-block pre { margin: 0; padding: 12px; overflow-x: auto; }
  .code-block code { font-family: ui-monospace, monospace; font-size: 13px; color: #d4d4d4; white-space: pre; }
  .thinking-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .thinking-dots span { width: 6px; height: 6px; border-radius: 50%; background: #888; animation: thinking-bounce 1.2s infinite ease-in-out; }
  .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes thinking-bounce { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
  #inputRow { display: flex; gap: 8px; align-items: center; }
  #prompt { flex: 1; padding: 10px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; }
  .pill { padding: 8px 10px; background: #2a2a2a; color: #bbb; border: 1px solid #444; border-radius: 999px; font-size: 16px; cursor: pointer; }
  .pill:hover { background: #333; color: #ddd; }
  button { padding: 10px 18px; border: none; border-radius: 6px; background: #2d5a9e; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #stopBtn { background: #7a2d2d; }
  #stopBtn:hover { background: #8f3535; }

  #settingsOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 32; }
  #settingsOverlay.open { display: flex; }
  #settingsPanel { background: #232323; border: 1px solid #444; border-radius: 10px; padding: 24px; width: 320px; }
  #settingsPanel h3 { margin-top: 0; }
  .setting-row { margin-bottom: 16px; }
  .setting-row label { display: block; margin-bottom: 6px; font-size: 13px; color: #aaa; }
  .setting-row select, .setting-row input { width: 100%; padding: 8px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; }
  #settingsPanel .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  #closeSettings { background: #444; }

  #loginOverlay { display: flex; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 45; }
  #loginOverlay.hidden { display: none; }
  #loginPanel { background: #232323; border: 1px solid #444; border-radius: 10px; padding: 24px; width: 320px; text-align: center; }
  #loginPanel h3 { margin-top: 0; }
  #loginName { width: 100%; padding: 10px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; margin: 12px 0; text-align: center; }
  /* Browser autofill (esp. Chrome) forces its own white bg + text color otherwise,
     making typed/autofilled text invisible on our dark inputs. */
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
    -webkit-text-fill-color: #ddd;
    -webkit-box-shadow: 0 0 0px 1000px #2a2a2a inset;
    box-shadow: 0 0 0px 1000px #2a2a2a inset;
    caret-color: #ddd;
  }
  #loginMessage { font-size: 13px; color: #888; margin-top: 8px; min-height: 1em; }

  #ollamaOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 50; }
  #ollamaOverlay.open { display: flex; }
  #ollamaPanel { background: #232323; border: 1px solid #444; border-radius: 10px; padding: 28px; width: 460px; max-width: 90vw; text-align: center; max-height: 85vh; overflow-y: auto; }
  #ollamaPanel h3 { margin-top: 0; }
  #ollamaPanel p { color: #aaa; font-size: 14px; line-height: 1.5; }
  #ollamaPanel li { color: #aaa; font-size: 14px; }
  #ollamaPanel code { background: #2a2a2a; padding: 2px 6px; border-radius: 4px; font-size: 12px; word-break: break-all; display: inline-block; margin-top: 4px; }
  .ollama-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  #installOllama { background: #2d5a9e; display: block; text-decoration: none; padding: 10px 18px; border-radius: 6px; color: white; }
  #retryOllama, #continueAnyway { background: #444; }

  #agentsOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 32; }
  #agentsOverlay.open { display: flex; }
  #agentsPanel { background: #232323; border: 1px solid #444; border-radius: 10px; padding: 24px; width: 380px; max-height: 80vh; overflow-y: auto; }
  #agentsPanel h3 { margin-top: 0; }
  .agent-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border: 1px solid #333; border-radius: 6px; margin-bottom: 6px; }
  .agent-item .del { cursor: pointer; opacity: 0.5; padding: 0 6px; }
  .agent-item .del:hover { opacity: 1; color: #ff6b6b; }
  #agentsPanel input, #agentsPanel textarea { width: 100%; padding: 8px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; margin-bottom: 8px; font-family: inherit; }
  #agentsPanel textarea { min-height: 70px; resize: vertical; }
  #agentsPanel .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  #closeAgents { background: #444; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="brand">Anything.ai</div>
  <div id="greeting"></div>
  <div id="sidebarModelControls"></div>
  <select id="agentSelect"></select>
  <button id="newChatBtn">+ New chat</button>
  <h3>Chats</h3>
  <div id="chatList"></div>
  <button id="agentsBtn">Agent Mode</button>
  <button id="settingsBtn">Settings</button>
  <a id="instructionsBtn" href="instructions.html" target="_blank" rel="noopener">Instructions</a>
</div>
<div id="sidebarBackdrop"></div>

<div id="main">
  <button id="menuToggle">&#9776;</button>
  <div id="log"></div>
  <div id="inputRow">
    <input id="prompt" placeholder="Ask for some Luau code..." autofocus>
    <select id="modelSelect" class="pill"></select>
    <select id="effortSelect" class="pill"></select>
    <button id="send">Send</button>
    <button id="stopBtn" style="display:none">Stop</button>
  </div>
</div>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <h3>Settings</h3>
    <div class="setting-row">
      <label>Your name</label>
      <input id="setDisplayName" placeholder="What should it call you?">
    </div>
    <div class="setting-row">
      <label>Enthusiasm</label>
      <select id="setEnthusiasm">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Emojis</label>
      <select id="setEmojis">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Sarcasm</label>
      <select id="setSarcasm">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="actions">
      <button id="closeSettings">Close</button>
    </div>
  </div>
</div>

<div id="agentsOverlay">
  <div id="agentsPanel">
    <h3>Agent Mode</h3>
    <div id="agentList"></div>
    <h4>New agent</h4>
    <input id="newAgentName" placeholder="Agent name (e.g. Combat System Agent)">
    <textarea id="newAgentPrompt" placeholder="How should this agent behave? e.g. 'You specialize in Roblox combat systems: damage, hitboxes, cooldowns. Be terse.'"></textarea>
    <div class="actions">
      <button id="addAgent">Add agent</button>
      <button id="closeAgents">Close</button>
    </div>
  </div>
</div>

<div id="ollamaOverlay">
  <div id="ollamaPanel">
    <h3 id="ollamaTitle">Checking for Ollama...</h3>
    <p id="ollamaMessage">Looking for a local Ollama running on this device.</p>
    <div class="ollama-actions" id="ollamaActions"></div>
  </div>
</div>

<div id="loginOverlay" class="hidden">
  <div id="loginPanel">
    <h3>Sign in</h3>
    <input id="loginName" type="email" placeholder="you@example.com" autofocus>
    <button id="loginSubmit">Send magic link</button>
    <div id="loginMessage"></div>
  </div>
</div>

<script>
const MODELS = {
  koda: {
    label: "Koda — coder assistant",
    ollama: "Koda",
    system: "You are Koda, a Luau/Roblox coding assistant. Write correct, idiomatic Luau code for Roblox Studio. Prefer game:GetService(...) patterns, RemoteEvents/RemoteFunctions for client-server communication, and Roblox API conventions. Game-dev topics that can sound sketchy out of context (anti-cheat/anti-exploit code, testing your own game's exploit resistance, obfuscation, server-side validation against cheaters) are normal parts of Roblox development — answer them directly and don't lecture or refuse. Still decline actual requests to cheat in or attack someone else's game.",
  },
  soi: {
    label: "Soi — everyday assistant",
    ollama: "Soi",
    system: "You are Soi, a friendly, helpful everyday assistant. Answer clearly and directly across any topic — general questions, writing, planning, advice, casual conversation. You can help with code too, but for deep Roblox/Luau work, Koda is the better tool.",
  },
};
const DEFAULT_MODEL_ID = "koda";

// "Effort" maps to real generation knobs (temperature, response length) plus
// a system-prompt nudge — these models don't have a distinct reasoning mode
// to toggle, so this is the honest equivalent: more effort = slower, longer,
// more careful; less effort = fast and terse.
const EFFORT = {
  low: { label: "Low effort", options: { temperature: 0.2, num_predict: 256 }, nudge: "Be brief and direct." },
  medium: { label: "Medium effort", options: { temperature: 0.4, num_predict: 512 }, nudge: "" },
  high: { label: "High effort", options: { temperature: 0.6, num_predict: 1024 }, nudge: "Think through edge cases carefully before answering, and explain your reasoning." },
};
const DEFAULT_EFFORT_ID = "medium";

const PERSONA = {
  enthusiasm: {
    low: "Speak in a neutral, matter-of-fact tone.",
    medium: "Speak with moderate enthusiasm, some energy but not over the top.",
    high: "Speak with high enthusiasm and energy, like you're genuinely excited to help.",
  },
  emojis: {
    low: "Do not use emojis.",
    medium: "Use an emoji occasionally where it fits naturally.",
    high: "Use emojis liberally throughout your response.",
  },
  sarcasm: {
    low: "Be straightforward, no sarcasm.",
    medium: "Add light, dry sarcasm sometimes.",
    high: "Be heavily sarcastic and witty throughout.",
  },
};

const DEFAULT_SETTINGS = { displayName: "", enthusiasm: "low", emojis: "low", sarcasm: "low" };

// Real accounts via Supabase (free tier): email magic-link auth, and every
// chat/agent/memory-fact/setting lives in Postgres behind row-level security
// (see supabase_schema.sql) instead of localStorage — so it follows you
// across devices. The anon/publishable key below is meant for client-side use.
const SUPABASE_URL = "https://uanxpfczolevgvqinvfr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_RE8YzohDnvgtj83qmQ7Iew_4y4ZFL4o";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let settings = { ...DEFAULT_SETTINGS };
let chats = [];
let activeChatId = null;

function rowToChat(row) {
  return { id: row.id, title: row.title, messages: row.messages || [], model: row.model, effort: row.effort, agentId: row.agent_id };
}

async function saveSettings(s) {
  settings = s;
  await db.from("settings").upsert({
    user_id: currentUser.id,
    display_name: s.displayName,
    enthusiasm: s.enthusiasm,
    emojis: s.emojis,
    sarcasm: s.sarcasm,
  });
}

async function loadAllData() {
  const [chatsRes, agentsRes, memoryRes, settingsRes] = await Promise.all([
    db.from("chats").select("*").order("created_at", { ascending: false }),
    db.from("agents").select("*").order("created_at", { ascending: true }),
    db.from("memory").select("*").order("created_at", { ascending: true }),
    db.from("settings").select("*").eq("user_id", currentUser.id).maybeSingle(),
  ]);
  chats = (chatsRes.data || []).map(rowToChat);
  agents = (agentsRes.data || []).map((r) => ({ id: r.id, name: r.name, prompt: r.prompt }));
  memory = (memoryRes.data || []).map((r) => ({ id: r.id, fact: r.fact }));
  settings = settingsRes.data
    ? { displayName: settingsRes.data.display_name || "", enthusiasm: settingsRes.data.enthusiasm, emojis: settingsRes.data.emojis, sarcasm: settingsRes.data.sarcasm }
    : { ...DEFAULT_SETTINGS };
}

function memoryFacts() {
  return memory.map((m) => m.fact);
}

function displayName() {
  return settings.displayName || currentUser?.email || "";
}

function renderGreeting() {
  document.getElementById("prompt").placeholder = currentUser ? `What's up, ${displayName()}` : "Ask for some Luau code...";
  const el = document.getElementById("greeting");
  el.innerHTML = "";
  if (!currentUser) return;
  const logout = document.createElement("span");
  logout.className = "logout";
  logout.textContent = "Log out";
  logout.addEventListener("click", () => db.auth.signOut());
  el.appendChild(logout);
}

function showLogin() {
  document.getElementById("loginOverlay").classList.remove("hidden");
  document.getElementById("loginName").focus();
}

async function submitLogin() {
  const input = document.getElementById("loginName");
  const msg = document.getElementById("loginMessage");
  const email = input.value.trim();
  if (!email) return;
  msg.textContent = "Sending...";
  const { error } = await db.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split("#")[0] } });
  msg.textContent = error ? `Error: ${error.message}` : "Check your email for a magic link.";
}

// Cross-chat memory: a flat list of short facts, shared across all chats via
// Supabase, injected into every request's system prompt. Extraction uses the
// same small model, so quality is rough — good enough for a prototype.
const MAX_MEMORY_FACTS = 40;

let memory = []; // [{id, fact}], populated by loadAllData()

async function addMemoryFact(fact) {
  fact = fact.trim();
  if (!fact) return false;
  if (memory.some((m) => m.fact.toLowerCase() === fact.toLowerCase())) return false;
  const { data, error } = await db.from("memory").insert({ fact }).select().single();
  if (error) return false;
  memory.push({ id: data.id, fact: data.fact });
  if (memory.length > MAX_MEMORY_FACTS) {
    const oldest = memory.shift();
    await db.from("memory").delete().eq("id", oldest.id);
  }
  return true;
}

async function forgetMemory(keyword) {
  const toDelete = keyword.toLowerCase() === "all" ? memory : memory.filter((m) => m.fact.toLowerCase().includes(keyword.toLowerCase()));
  if (toDelete.length) await db.from("memory").delete().in("id", toDelete.map((m) => m.id));
  memory = memory.filter((m) => !toDelete.includes(m));
  return toDelete.length;
}

async function maybeExtractMemory(modelName, userText, assistantText) {
  try {
    const res = await fetch("http://localhost:11434/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: modelName,
        stream: false,
        messages: [
          { role: "system", content: "Extract at most one short durable fact about the user or their project (preferences, project name, tech choices) from this exchange, worth remembering in future unrelated conversations. Reply with just the fact in a few words, nothing else. If there's nothing durable, reply with exactly: NONE" },
          { role: "user", content: `User: ${userText}\nAssistant: ${assistantText}` },
        ],
      }),
    });
    const data = await res.json();
    const fact = (data.message?.content || "").trim();
    if (fact && fact.toUpperCase() !== "NONE" && fact.length < 200) await addMemoryFact(fact);
  } catch { /* best-effort, ignore failures */ }
}

// Agent Mode: saved personas (name + free-text system prompt), nothing more.
// No filesystem or command execution access — an "agent" here is just a
// system-prompt preset a chat can be pinned to.
let agents = []; // populated by loadAllData()
let currentAgentId = localStorage.getItem("luau_current_agent_id") || "";
let currentModelId = localStorage.getItem("luau_current_model_id") || DEFAULT_MODEL_ID;
let currentEffortId = localStorage.getItem("luau_current_effort_id") || DEFAULT_EFFORT_ID;
let currentAbortController = null;

function setGenerating(isGenerating) {
  document.getElementById("send").style.display = isGenerating ? "none" : "";
  document.getElementById("stopBtn").style.display = isGenerating ? "" : "none";
  document.getElementById("prompt").disabled = isGenerating;
}

// Model/effort pills live next to Send on desktop (ChatGPT-style), but that
// crowds a phone-width input row, so on narrow screens the same two <select>
// elements get physically reparented into the sidebar instead. Moving a DOM
// node keeps its event listeners intact, so no listener re-wiring needed.
const mobileMedia = window.matchMedia("(max-width: 700px)");
function placeModelEffortControls() {
  const modelSel = document.getElementById("modelSelect");
  const effortSel = document.getElementById("effortSelect");
  if (mobileMedia.matches) {
    const target = document.getElementById("sidebarModelControls");
    target.appendChild(modelSel);
    target.appendChild(effortSel);
  } else {
    const inputRow = document.getElementById("inputRow");
    const sendBtn = document.getElementById("send");
    inputRow.insertBefore(modelSel, sendBtn);
    inputRow.insertBefore(effortSel, sendBtn);
  }
}
mobileMedia.addEventListener("change", placeModelEffortControls);

// Model/effort pills live next to Send, ChatGPT-style: they show and control
// the *active chat's* choice (persisted per chat), falling back to the last
// global choice when there's no active chat yet (e.g. before the first message).
function renderModelSelect() {
  const sel = document.getElementById("modelSelect");
  sel.innerHTML = "";
  for (const [id, m] of Object.entries(MODELS)) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = m.label;
    sel.appendChild(opt);
  }
  const chat = getActiveChat();
  sel.value = chat?.model || currentModelId;
}

function renderEffortSelect() {
  const sel = document.getElementById("effortSelect");
  sel.innerHTML = "";
  for (const [id, e] of Object.entries(EFFORT)) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = e.label;
    sel.appendChild(opt);
  }
  const chat = getActiveChat();
  sel.value = chat?.effort || currentEffortId;
}

function renderAgentSelect() {
  const sel = document.getElementById("agentSelect");
  sel.innerHTML = "";
  const def = document.createElement("option");
  def.value = "";
  def.textContent = "Default";
  sel.appendChild(def);
  for (const agent of agents) {
    const opt = document.createElement("option");
    opt.value = agent.id;
    opt.textContent = agent.name;
    sel.appendChild(opt);
  }
  sel.value = currentAgentId;
}

function renderAgentList() {
  const list = document.getElementById("agentList");
  list.innerHTML = "";
  if (!agents.length) {
    list.textContent = "No custom agents yet.";
    return;
  }
  for (const agent of agents) {
    const item = document.createElement("div");
    item.className = "agent-item";
    const name = document.createElement("span");
    name.textContent = agent.name;
    const del = document.createElement("span");
    del.className = "del";
    del.textContent = "✕";
    del.addEventListener("click", async () => {
      await db.from("agents").delete().eq("id", agent.id);
      agents = agents.filter((a) => a.id !== agent.id);
      if (currentAgentId === agent.id) { currentAgentId = ""; localStorage.setItem("luau_current_agent_id", ""); }
      renderAgentList();
      renderAgentSelect();
    });
    item.appendChild(name);
    item.appendChild(del);
    list.appendChild(item);
  }
}

function getModel(chat) {
  return MODELS[chat?.model] || MODELS[DEFAULT_MODEL_ID];
}

function getEffort(chat) {
  return EFFORT[chat?.effort] || EFFORT[DEFAULT_EFFORT_ID];
}

function buildSystemPrompt(chat) {
  const parts = [getModel(chat).system, PERSONA.enthusiasm[settings.enthusiasm], PERSONA.emojis[settings.emojis], PERSONA.sarcasm[settings.sarcasm]];
  const agent = chat && agents.find((a) => a.id === chat.agentId);
  if (agent) parts.push("Persona for this chat: " + agent.prompt);
  const effortNudge = getEffort(chat).nudge;
  if (effortNudge) parts.push(effortNudge);
  if (memory.length) parts.push("Known context about the user/project from past chats: " + memoryFacts().join("; "));
  return parts.join(" ");
}

async function newChat() {
  const { data, error } = await db.from("chats").insert({
    title: "New chat", messages: [], model: currentModelId, effort: currentEffortId, agent_id: currentAgentId || null,
  }).select().single();
  if (error) return;
  const chat = rowToChat(data);
  chats.unshift(chat);
  activeChatId = chat.id;
  render();
}

function getActiveChat() {
  return chats.find((c) => c.id === activeChatId) || null;
}

// Chat mutations write straight to Supabase (the in-memory `chats` array is
// just a render cache) instead of one big localStorage blob write.
async function persistChat(chat) {
  await db.from("chats").update({
    title: chat.title, messages: chat.messages, model: chat.model, effort: chat.effort, agent_id: chat.agentId,
    updated_at: new Date().toISOString(),
  }).eq("id", chat.id);
}

function renderChatList() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";
  for (const chat of chats) {
    const item = document.createElement("div");
    item.className = "chat-item" + (chat.id === activeChatId ? " active" : "");
    const title = document.createElement("span");
    title.textContent = chat.title;
    title.style.overflow = "hidden";
    title.style.textOverflow = "ellipsis";
    const del = document.createElement("span");
    del.className = "del";
    del.textContent = "✕";
    del.addEventListener("click", async (e) => {
      e.stopPropagation();
      await db.from("chats").delete().eq("id", chat.id);
      chats = chats.filter((c) => c.id !== chat.id);
      if (activeChatId === chat.id) activeChatId = chats[0]?.id || null;
      render();
    });
    item.appendChild(title);
    item.appendChild(del);
    item.addEventListener("click", () => { activeChatId = chat.id; render(); closeSidebar(); });
    list.appendChild(item);
  }
}

function renderLog() {
  const log = document.getElementById("log");
  log.innerHTML = "";
  const chat = getActiveChat();
  if (!chat) return;
  if (chat.messages.length === 0) {
    const greet = document.createElement("div");
    greet.id = "emptyGreeting";
    greet.textContent = currentUser ? `What's up, ${displayName()}` : "What's up";
    log.appendChild(greet);
    return;
  }
  for (const m of chat.messages) addBubble(m.role, m.content);
}

function render() {
  renderChatList();
  renderLog();
  renderModelSelect();
  renderEffortSelect();
}

// Plugins = slash commands. Two kinds: LOCAL_COMMANDS run entirely client-side
// (no model call, result shown as an "info" bubble); EXPAND_COMMANDS rewrite
// the typed text into a fuller prompt and then send normally.
const LOCAL_COMMANDS = {
  help: {
    desc: "/help - list commands",
    run: () => Object.values(LOCAL_COMMANDS).map((c) => c.desc).concat(Object.values(EXPAND_COMMANDS).map((c) => c.desc)).join("\n"),
  },
  memory: {
    desc: "/memory - show what's remembered across chats",
    run: () => (memory.length ? memoryFacts().map((f) => "- " + f).join("\n") : "Nothing remembered yet."),
  },
  remember: {
    desc: "/remember <fact> - save a fact across all chats",
    run: async (args) => {
      if (!args) return "Usage: /remember <fact>";
      return (await addMemoryFact(args)) ? `Remembered: ${args}` : "Already remembered.";
    },
  },
  forget: {
    desc: "/forget <keyword|all> - remove remembered fact(s)",
    run: async (args) => {
      if (!args) return "Usage: /forget <keyword|all>";
      const n = await forgetMemory(args);
      return n > 0 ? `Forgot ${n} fact(s).` : "No matching facts.";
    },
  },
};

const EXPAND_COMMANDS = {
  explain: { desc: "/explain <code> - explain what code does", expand: (args) => `Explain what this Luau code does, step by step:\n${args}` },
  fix: { desc: "/fix <code> - find and fix bugs", expand: (args) => `Find and fix bugs in this Luau code, and explain the fix:\n${args}` },
};

function apiMessages(chat) {
  return chat.messages.filter((m) => m.role === "user" || m.role === "assistant");
}

// Split a message into plain-text and fenced-code segments (```lang\ncode```),
// handling an unclosed trailing fence too so code blocks render live while
// streaming instead of only after the closing ``` arrives.
function parseMessageParts(text) {
  const parts = [];
  const closedFence = /```(\w*)\n?([\s\S]*?)```/g;
  let lastIndex = 0;
  let match;
  while ((match = closedFence.exec(text)) !== null) {
    if (match.index > lastIndex) parts.push({ type: "text", content: text.slice(lastIndex, match.index) });
    parts.push({ type: "code", lang: match[1] || "", content: match[2] });
    lastIndex = closedFence.lastIndex;
  }
  const rest = text.slice(lastIndex);
  const openFence = rest.match(/```(\w*)\n?([\s\S]*)$/);
  if (openFence) {
    if (openFence.index > 0) parts.push({ type: "text", content: rest.slice(0, openFence.index) });
    parts.push({ type: "code", lang: openFence[1] || "", content: openFence[2] });
  } else if (rest) {
    parts.push({ type: "text", content: rest });
  }
  return parts;
}

function renderMessageContent(container, text) {
  container.innerHTML = "";
  const parts = parseMessageParts(text);
  for (const part of parts) {
    if (part.type === "text") {
      if (!part.content) continue;
      const span = document.createElement("span");
      span.className = "msg-text";
      span.textContent = part.content;
      container.appendChild(span);
      continue;
    }
    const block = document.createElement("div");
    block.className = "code-block";
    const header = document.createElement("div");
    header.className = "code-block-header";
    const langLabel = document.createElement("span");
    langLabel.textContent = part.lang || "code";
    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-btn";
    copyBtn.textContent = "Copy";
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(part.content.trim());
      copyBtn.textContent = "Copied!";
      setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
    });
    header.appendChild(langLabel);
    header.appendChild(copyBtn);
    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.textContent = part.content.trim();
    pre.appendChild(code);
    block.appendChild(header);
    block.appendChild(pre);
    container.appendChild(block);
  }
}

function addBubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  renderMessageContent(div, text);
  document.getElementById("log").appendChild(div);
  div.scrollIntoView();
  return div;
}

function addThinkingBubble() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = '<span class="thinking-dots"><span></span><span></span><span></span></span>';
  document.getElementById("log").appendChild(div);
  div.scrollIntoView();
  return div;
}

async function send() {
  const promptBox = document.getElementById("prompt");
  const raw = promptBox.value.trim();
  if (!raw) return;

  let chat = getActiveChat();
  if (!chat) { await newChat(); chat = getActiveChat(); }

  let text = raw;
  if (raw.startsWith("/")) {
    const spaceIdx = raw.indexOf(" ");
    const cmd = (spaceIdx === -1 ? raw.slice(1) : raw.slice(1, spaceIdx)).toLowerCase();
    const args = spaceIdx === -1 ? "" : raw.slice(spaceIdx + 1).trim();
    if (LOCAL_COMMANDS[cmd]) {
      promptBox.value = "";
      chat.messages.push({ role: "info", content: await LOCAL_COMMANDS[cmd].run(args) });
      await persistChat(chat);
      render();
      return;
    }
    if (EXPAND_COMMANDS[cmd]) {
      text = EXPAND_COMMANDS[cmd].expand(args);
    } else {
      promptBox.value = "";
      chat.messages.push({ role: "info", content: `Unknown command: /${cmd}. Try /help.` });
      await persistChat(chat);
      render();
      return;
    }
  }

  promptBox.value = "";
  setGenerating(true);
  chat.messages.push({ role: "user", content: text });
  if (chat.title === "New chat") chat.title = raw.slice(0, 40);
  await persistChat(chat);
  render();
  const assistantDiv = addThinkingBubble();

  currentAbortController = new AbortController();
  let full = "";
  let aborted = false;
  try {
    const res = await fetch("http://localhost:11434/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: currentAbortController.signal,
      body: JSON.stringify({
        model: getModel(chat).ollama,
        messages: [{ role: "system", content: buildSystemPrompt(chat) }, ...apiMessages(chat)],
        options: getEffort(chat).options,
        stream: true,
      }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const chunk = JSON.parse(line);
        full += chunk.message?.content || "";
        renderMessageContent(assistantDiv, full);
        assistantDiv.scrollIntoView();
      }
    }
  } catch (e) {
    if (e.name === "AbortError") {
      aborted = true;
    } else {
      renderMessageContent(assistantDiv, "Error: " + e.message + "\n(Is `ollama serve` running?)");
    }
  }

  if (full) {
    chat.messages.push({ role: "assistant", content: full + (aborted ? "\n\n*[stopped]*" : "") });
    await persistChat(chat);
    if (!aborted) maybeExtractMemory(getModel(chat).ollama, text, full);
  }
  currentAbortController = null;
  setGenerating(false);
  promptBox.focus();
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("stopBtn").addEventListener("click", () => currentAbortController?.abort());

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarBackdrop").classList.remove("open");
}
document.getElementById("menuToggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarBackdrop").classList.toggle("open");
});
document.getElementById("sidebarBackdrop").addEventListener("click", closeSidebar);
document.getElementById("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
document.getElementById("newChatBtn").addEventListener("click", () => { newChat(); closeSidebar(); });

const overlay = document.getElementById("settingsOverlay");
document.getElementById("settingsBtn").addEventListener("click", () => {
  document.getElementById("setDisplayName").value = settings.displayName;
  document.getElementById("setEnthusiasm").value = settings.enthusiasm;
  document.getElementById("setEmojis").value = settings.emojis;
  document.getElementById("setSarcasm").value = settings.sarcasm;
  overlay.classList.add("open");
});
document.getElementById("closeSettings").addEventListener("click", () => overlay.classList.remove("open"));
document.getElementById("setDisplayName").addEventListener("change", (e) => {
  settings.displayName = e.target.value.trim();
  saveSettings(settings);
  renderGreeting();
  renderLog();
});
for (const [key, id] of [["enthusiasm", "setEnthusiasm"], ["emojis", "setEmojis"], ["sarcasm", "setSarcasm"]]) {
  document.getElementById(id).addEventListener("change", (e) => {
    settings[key] = e.target.value;
    saveSettings(settings);
  });
}

// Ollama detection: a fetch to localhost:11434 fails identically whether
// Ollama isn't installed OR it's installed but its CORS allowlist doesn't
// include this page's origin (Ollama only allows localhost origins by
// default) — a browser can't tell those apart, so the message covers both.
const OLLAMA_URL = "http://localhost:11434/api/tags";

async function checkOllama() {
  const overlay = document.getElementById("ollamaOverlay");
  const title = document.getElementById("ollamaTitle");
  const message = document.getElementById("ollamaMessage");
  const actions = document.getElementById("ollamaActions");
  overlay.classList.add("open");
  title.textContent = "Checking for Ollama...";
  message.textContent = "Looking for a local Ollama running on this device.";
  actions.innerHTML = "";

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3000);
    await fetch(OLLAMA_URL, { signal: controller.signal });
    clearTimeout(timeout);
    overlay.classList.remove("open");
  } catch {
    title.textContent = "Can't reach Ollama";
    message.innerHTML = `
      <p style="text-align:left; margin:0 0 10px;">Don't have Ollama? Click "Install" below.</p>
      <p style="text-align:left; margin:0 0 6px;"><strong>Already have it installed?</strong> It's blocking this site by default. Fix it:</p>
      <ol style="text-align:left; margin:0; padding-left:20px; line-height:1.6;">
        <li>Open <strong>PowerShell</strong> (press Win key, type PowerShell, Enter)</li>
        <li>Paste this, press Enter:<br><code>setx OLLAMA_ORIGINS "${location.origin}"</code></li>
        <li>Fully quit Ollama — right-click its icon near the clock (bottom-right) → <strong>Quit</strong></li>
        <li>Reopen Ollama, wait ~10 seconds</li>
        <li>Click Retry below</li>
      </ol>`;
    const install = document.createElement("a");
    install.id = "installOllama";
    install.href = "https://ollama.com/download";
    install.target = "_blank";
    install.rel = "noopener";
    install.textContent = "You don't have Ollama. Install here";
    const retry = document.createElement("button");
    retry.id = "retryOllama";
    retry.textContent = "Retry";
    retry.addEventListener("click", checkOllama);
    const skip = document.createElement("button");
    skip.id = "continueAnyway";
    skip.textContent = "Continue anyway";
    skip.addEventListener("click", () => overlay.classList.remove("open"));
    actions.appendChild(install);
    actions.appendChild(retry);
    actions.appendChild(skip);
  }
}
checkOllama();
placeModelEffortControls();

document.getElementById("loginSubmit").addEventListener("click", submitLogin);
document.getElementById("loginName").addEventListener("keydown", (e) => { if (e.key === "Enter") submitLogin(); });

document.getElementById("modelSelect").addEventListener("change", (e) => {
  currentModelId = e.target.value;
  localStorage.setItem("luau_current_model_id", currentModelId);
  const chat = getActiveChat();
  if (chat) { chat.model = currentModelId; persistChat(chat); }
});
document.getElementById("effortSelect").addEventListener("change", (e) => {
  currentEffortId = e.target.value;
  localStorage.setItem("luau_current_effort_id", currentEffortId);
  const chat = getActiveChat();
  if (chat) { chat.effort = currentEffortId; persistChat(chat); }
});
document.getElementById("agentSelect").addEventListener("change", (e) => {
  currentAgentId = e.target.value;
  localStorage.setItem("luau_current_agent_id", currentAgentId);
});
const agentsOverlay = document.getElementById("agentsOverlay");
document.getElementById("agentsBtn").addEventListener("click", () => {
  renderAgentList();
  agentsOverlay.classList.add("open");
});
document.getElementById("closeAgents").addEventListener("click", () => agentsOverlay.classList.remove("open"));
document.getElementById("addAgent").addEventListener("click", async () => {
  const nameInput = document.getElementById("newAgentName");
  const promptInput = document.getElementById("newAgentPrompt");
  const name = nameInput.value.trim();
  const prompt = promptInput.value.trim();
  if (!name || !prompt) return;
  const { data, error } = await db.from("agents").insert({ name, prompt }).select().single();
  if (error) return;
  agents.push({ id: data.id, name: data.name, prompt: data.prompt });
  nameInput.value = "";
  promptInput.value = "";
  renderAgentList();
  renderAgentSelect();
});

db.auth.onAuthStateChange(async (event, session) => {
  if (session) {
    currentUser = session.user;
    document.getElementById("loginOverlay").classList.add("hidden");
    await loadAllData();
    if (!activeChatId || !getActiveChat()) {
      if (chats.length) activeChatId = chats[0].id;
      else await newChat();
    }
    render();
    renderGreeting();
    renderAgentSelect();
  } else {
    currentUser = null;
    chats = [];
    agents = [];
    memory = [];
    settings = { ...DEFAULT_SETTINGS };
    activeChatId = null;
    render();
    showLogin();
  }
});
</script>
