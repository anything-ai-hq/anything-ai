<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Soi &amp; Koda</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #1e1e1e; color: #ddd; display: flex; height: 100vh; }

  #sidebar { width: 220px; background: #171717; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 10px; gap: 6px; overflow-y: auto; }
  #sidebar h3 { margin: 4px 0 8px; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  .chat-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .chat-item:hover { background: #262626; }
  .chat-item.active { background: #2d5a9e; }
  .chat-item .del { opacity: 0.4; font-size: 12px; padding: 0 4px; }
  .chat-item .del:hover { opacity: 1; color: #ff6b6b; }
  #newChatBtn, #settingsBtn, #agentsBtn { padding: 8px; border: 1px solid #444; border-radius: 6px; background: #262626; color: #ddd; cursor: pointer; text-align: left; }
  #newChatBtn:hover, #settingsBtn:hover, #agentsBtn:hover { background: #333; }
  #settingsBtn { margin-top: auto; }
  #agentSelect { width: 100%; padding: 8px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; margin-bottom: 4px; }

  #greeting { padding: 8px 4px 4px; font-size: 14px; color: #ddd; }
  #greeting .logout { display: block; margin-top: 2px; font-size: 12px; color: #888; cursor: pointer; }
  #greeting .logout:hover { color: #ccc; text-decoration: underline; }

  #main { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; padding: 1.5rem; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 12px; margin-bottom: 1rem; overflow-y: auto; }
  #emptyGreeting { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #666; }
  .msg { padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; max-width: 90%; }
  .user { background: #2d5a9e; align-self: flex-end; }
  .assistant { background: #333; align-self: flex-start; font-family: ui-monospace, monospace; }
  .info { background: transparent; border: 1px dashed #444; color: #999; align-self: center; font-size: 13px; font-family: ui-monospace, monospace; max-width: 100%; }
  #inputRow { display: flex; gap: 8px; align-items: center; }
  #prompt { flex: 1; padding: 10px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; }
  .pill { padding: 8px 10px; background: #2a2a2a; color: #bbb; border: 1px solid #444; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .pill:hover { background: #333; color: #ddd; }
  button { padding: 10px 18px; border: none; border-radius: 6px; background: #2d5a9e; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }

  #settingsOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
  #settingsOverlay.open { display: flex; }
  #settingsPanel { background: #232323; border: 1px solid #444; border-radius: 10px; padding: 24px; width: 320px; }
  #settingsPanel h3 { margin-top: 0; }
  .setting-row { margin-bottom: 16px; }
  .setting-row label { display: block; margin-bottom: 6px; font-size: 13px; color: #aaa; }
  .setting-row select { width: 100%; padding: 8px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; }
  #settingsPanel .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  #closeSettings { background: #444; }

  #loginOverlay { display: flex; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 10; }
  #loginOverlay.hidden { display: none; }
  #loginPanel { background: #232323; border: 1px solid #444; border-radius: 10px; padding: 24px; width: 320px; text-align: center; }
  #loginPanel h3 { margin-top: 0; }
  #loginName { width: 100%; padding: 10px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; margin: 12px 0; text-align: center; }

  #agentsOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
  #agentsOverlay.open { display: flex; }
  #agentsPanel { background: #232323; border: 1px solid #444; border-radius: 10px; padding: 24px; width: 380px; max-height: 80vh; overflow-y: auto; }
  #agentsPanel h3 { margin-top: 0; }
  .agent-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border: 1px solid #333; border-radius: 6px; margin-bottom: 6px; }
  .agent-item .del { cursor: pointer; opacity: 0.5; padding: 0 6px; }
  .agent-item .del:hover { opacity: 1; color: #ff6b6b; }
  #agentsPanel input, #agentsPanel textarea { width: 100%; padding: 8px; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; margin-bottom: 8px; font-family: inherit; }
  #agentsPanel textarea { min-height: 70px; resize: vertical; }
  #agentsPanel .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  #closeAgents { background: #444; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="greeting"></div>
  <select id="agentSelect"></select>
  <button id="newChatBtn">+ New chat</button>
  <h3>Chats</h3>
  <div id="chatList"></div>
  <button id="agentsBtn">Agent Mode</button>
  <button id="settingsBtn">Settings</button>
</div>

<div id="main">
  <div id="log"></div>
  <div id="inputRow">
    <input id="prompt" placeholder="Ask for some Luau code..." autofocus>
    <select id="modelSelect" class="pill"></select>
    <select id="effortSelect" class="pill"></select>
    <button id="send">Send</button>
  </div>
</div>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <h3>How should it talk?</h3>
    <div class="setting-row">
      <label>Enthusiasm</label>
      <select id="setEnthusiasm">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Emojis</label>
      <select id="setEmojis">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Sarcasm</label>
      <select id="setSarcasm">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="actions">
      <button id="closeSettings">Close</button>
    </div>
  </div>
</div>

<div id="agentsOverlay">
  <div id="agentsPanel">
    <h3>Agent Mode</h3>
    <div id="agentList"></div>
    <h4>New agent</h4>
    <input id="newAgentName" placeholder="Agent name (e.g. Combat System Agent)">
    <textarea id="newAgentPrompt" placeholder="How should this agent behave? e.g. 'You specialize in Roblox combat systems: damage, hitboxes, cooldowns. Be terse.'"></textarea>
    <div class="actions">
      <button id="addAgent">Add agent</button>
      <button id="closeAgents">Close</button>
    </div>
  </div>
</div>

<div id="loginOverlay" class="hidden">
  <div id="loginPanel">
    <h3>Who's coding?</h3>
    <input id="loginName" placeholder="Your name" autofocus>
    <button id="loginSubmit">Continue</button>
  </div>
</div>

<script>
const MODELS = {
  koda: {
    label: "Koda — coder assistant",
    ollama: "Koda",
    system: "You are Koda, a Luau/Roblox coding assistant. Write correct, idiomatic Luau code for Roblox Studio. Prefer game:GetService(...) patterns, RemoteEvents/RemoteFunctions for client-server communication, and Roblox API conventions. Game-dev topics that can sound sketchy out of context (anti-cheat/anti-exploit code, testing your own game's exploit resistance, obfuscation, server-side validation against cheaters) are normal parts of Roblox development — answer them directly and don't lecture or refuse. Still decline actual requests to cheat in or attack someone else's game.",
  },
  soi: {
    label: "Soi — everyday assistant",
    ollama: "Soi",
    system: "You are Soi, a friendly, helpful everyday assistant. Answer clearly and directly across any topic — general questions, writing, planning, advice, casual conversation. You can help with code too, but for deep Roblox/Luau work, Koda is the better tool.",
  },
};
const DEFAULT_MODEL_ID = "koda";

// "Effort" maps to real generation knobs (temperature, response length) plus
// a system-prompt nudge — these models don't have a distinct reasoning mode
// to toggle, so this is the honest equivalent: more effort = slower, longer,
// more careful; less effort = fast and terse.
const EFFORT = {
  low: { label: "Low effort", options: { temperature: 0.2, num_predict: 256 }, nudge: "Be brief and direct." },
  medium: { label: "Medium effort", options: { temperature: 0.4, num_predict: 512 }, nudge: "" },
  high: { label: "High effort", options: { temperature: 0.6, num_predict: 1024 }, nudge: "Think through edge cases carefully before answering, and explain your reasoning." },
};
const DEFAULT_EFFORT_ID = "medium";

const PERSONA = {
  enthusiasm: {
    low: "Speak in a neutral, matter-of-fact tone.",
    medium: "Speak with moderate enthusiasm, some energy but not over the top.",
    high: "Speak with high enthusiasm and energy, like you're genuinely excited to help.",
  },
  emojis: {
    low: "Do not use emojis.",
    medium: "Use an emoji occasionally where it fits naturally.",
    high: "Use emojis liberally throughout your response.",
  },
  sarcasm: {
    low: "Be straightforward, no sarcasm.",
    medium: "Add light, dry sarcasm sometimes.",
    high: "Be heavily sarcastic and witty throughout.",
  },
};

const DEFAULT_SETTINGS = { enthusiasm: "low", emojis: "low", sarcasm: "low" };

function loadSettings() {
  try { return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem("luau_settings")) }; }
  catch { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings(s) { localStorage.setItem("luau_settings", JSON.stringify(s)); }

function loadChats() {
  try { return JSON.parse(localStorage.getItem("luau_chats")) || []; }
  catch { return []; }
}
function saveChats(chats) { localStorage.setItem("luau_chats", JSON.stringify(chats)); }

let settings = loadSettings();
let chats = loadChats();
let activeChatId = localStorage.getItem("luau_active_chat_id");

// No backend here (static page hitting Ollama directly), so there's nothing to
// authenticate against. This is a name tag + localStorage, not real auth.
function loadUsername() { return localStorage.getItem("luau_username"); }
function saveUsername(name) { localStorage.setItem("luau_username", name); }

function renderGreeting() {
  const name = loadUsername();
  document.getElementById("prompt").placeholder = name ? `What's up, ${name}` : "Ask for some Luau code...";
  const el = document.getElementById("greeting");
  el.innerHTML = "";
  if (!name) return;
  const logout = document.createElement("span");
  logout.className = "logout";
  logout.textContent = "Log out";
  logout.addEventListener("click", () => {
    localStorage.removeItem("luau_username");
    showLogin();
  });
  el.appendChild(logout);
}

function showLogin() {
  document.getElementById("loginOverlay").classList.remove("hidden");
  document.getElementById("loginName").focus();
}

function submitLogin() {
  const input = document.getElementById("loginName");
  const name = input.value.trim();
  if (!name) return;
  saveUsername(name);
  input.value = "";
  document.getElementById("loginOverlay").classList.add("hidden");
  renderGreeting();
  renderLog();
}

// Cross-chat memory: a flat list of short facts, shared across all chats via
// localStorage, injected into every request's system prompt. Extraction uses
// the same small model, so quality is rough — good enough for a prototype.
const MAX_MEMORY_FACTS = 40;

function loadMemory() {
  try { return JSON.parse(localStorage.getItem("luau_memory")) || []; }
  catch { return []; }
}
function saveMemory(facts) { localStorage.setItem("luau_memory", JSON.stringify(facts)); }

let memory = loadMemory();

function addMemoryFact(fact) {
  fact = fact.trim();
  if (!fact) return false;
  if (memory.some((f) => f.toLowerCase() === fact.toLowerCase())) return false;
  memory.push(fact);
  if (memory.length > MAX_MEMORY_FACTS) memory.shift();
  saveMemory(memory);
  return true;
}

function forgetMemory(keyword) {
  const before = memory.length;
  if (keyword.toLowerCase() === "all") memory = [];
  else memory = memory.filter((f) => !f.toLowerCase().includes(keyword.toLowerCase()));
  saveMemory(memory);
  return before - memory.length;
}

async function maybeExtractMemory(modelName, userText, assistantText) {
  try {
    const res = await fetch("http://localhost:11434/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: modelName,
        stream: false,
        system: "Extract at most one short durable fact about the user or their project (preferences, project name, tech choices) from this exchange, worth remembering in future unrelated conversations. Reply with just the fact in a few words, nothing else. If there's nothing durable, reply with exactly: NONE",
        messages: [{ role: "user", content: `User: ${userText}\nAssistant: ${assistantText}` }],
      }),
    });
    const data = await res.json();
    const fact = (data.message?.content || "").trim();
    if (fact && fact.toUpperCase() !== "NONE" && fact.length < 200) addMemoryFact(fact);
  } catch { /* best-effort, ignore failures */ }
}

// Agent Mode: saved personas (name + free-text system prompt), nothing more.
// No filesystem or command execution access — an "agent" here is just a
// system-prompt preset a chat can be pinned to.
function loadAgents() {
  try { return JSON.parse(localStorage.getItem("luau_agents")) || []; }
  catch { return []; }
}
function saveAgents(a) { localStorage.setItem("luau_agents", JSON.stringify(a)); }

let agents = loadAgents();
let currentAgentId = localStorage.getItem("luau_current_agent_id") || "";
let currentModelId = localStorage.getItem("luau_current_model_id") || DEFAULT_MODEL_ID;
let currentEffortId = localStorage.getItem("luau_current_effort_id") || DEFAULT_EFFORT_ID;

// Model/effort pills live next to Send, ChatGPT-style: they show and control
// the *active chat's* choice (persisted per chat), falling back to the last
// global choice when there's no active chat yet (e.g. before the first message).
function renderModelSelect() {
  const sel = document.getElementById("modelSelect");
  sel.innerHTML = "";
  for (const [id, m] of Object.entries(MODELS)) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = m.label;
    sel.appendChild(opt);
  }
  const chat = getActiveChat();
  sel.value = chat?.model || currentModelId;
}

function renderEffortSelect() {
  const sel = document.getElementById("effortSelect");
  sel.innerHTML = "";
  for (const [id, e] of Object.entries(EFFORT)) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = e.label;
    sel.appendChild(opt);
  }
  const chat = getActiveChat();
  sel.value = chat?.effort || currentEffortId;
}

function renderAgentSelect() {
  const sel = document.getElementById("agentSelect");
  sel.innerHTML = "";
  const def = document.createElement("option");
  def.value = "";
  def.textContent = "Default";
  sel.appendChild(def);
  for (const agent of agents) {
    const opt = document.createElement("option");
    opt.value = agent.id;
    opt.textContent = agent.name;
    sel.appendChild(opt);
  }
  sel.value = currentAgentId;
}

function renderAgentList() {
  const list = document.getElementById("agentList");
  list.innerHTML = "";
  if (!agents.length) {
    list.textContent = "No custom agents yet.";
    return;
  }
  for (const agent of agents) {
    const item = document.createElement("div");
    item.className = "agent-item";
    const name = document.createElement("span");
    name.textContent = agent.name;
    const del = document.createElement("span");
    del.className = "del";
    del.textContent = "✕";
    del.addEventListener("click", () => {
      agents = agents.filter((a) => a.id !== agent.id);
      saveAgents(agents);
      if (currentAgentId === agent.id) { currentAgentId = ""; localStorage.setItem("luau_current_agent_id", ""); }
      renderAgentList();
      renderAgentSelect();
    });
    item.appendChild(name);
    item.appendChild(del);
    list.appendChild(item);
  }
}

function getModel(chat) {
  return MODELS[chat?.model] || MODELS[DEFAULT_MODEL_ID];
}

function getEffort(chat) {
  return EFFORT[chat?.effort] || EFFORT[DEFAULT_EFFORT_ID];
}

function buildSystemPrompt(chat) {
  const parts = [getModel(chat).system, PERSONA.enthusiasm[settings.enthusiasm], PERSONA.emojis[settings.emojis], PERSONA.sarcasm[settings.sarcasm]];
  const agent = chat && agents.find((a) => a.id === chat.agentId);
  if (agent) parts.push("Persona for this chat: " + agent.prompt);
  const effortNudge = getEffort(chat).nudge;
  if (effortNudge) parts.push(effortNudge);
  if (memory.length) parts.push("Known context about the user/project from past chats: " + memory.join("; "));
  return parts.join(" ");
}

function newChat() {
  const chat = { id: crypto.randomUUID(), title: "New chat", messages: [], agentId: currentAgentId || null, model: currentModelId, effort: currentEffortId };
  chats.unshift(chat);
  activeChatId = chat.id;
  persist();
  render();
}

function getActiveChat() {
  return chats.find((c) => c.id === activeChatId) || null;
}

function persist() {
  saveChats(chats);
  if (activeChatId) localStorage.setItem("luau_active_chat_id", activeChatId);
}

function renderChatList() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";
  for (const chat of chats) {
    const item = document.createElement("div");
    item.className = "chat-item" + (chat.id === activeChatId ? " active" : "");
    const title = document.createElement("span");
    title.textContent = chat.title;
    title.style.overflow = "hidden";
    title.style.textOverflow = "ellipsis";
    const del = document.createElement("span");
    del.className = "del";
    del.textContent = "✕";
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      chats = chats.filter((c) => c.id !== chat.id);
      if (activeChatId === chat.id) activeChatId = chats[0]?.id || null;
      persist();
      render();
    });
    item.appendChild(title);
    item.appendChild(del);
    item.addEventListener("click", () => { activeChatId = chat.id; persist(); render(); });
    list.appendChild(item);
  }
}

function renderLog() {
  const log = document.getElementById("log");
  log.innerHTML = "";
  const chat = getActiveChat();
  if (!chat) return;
  if (chat.messages.length === 0) {
    const name = loadUsername();
    const greet = document.createElement("div");
    greet.id = "emptyGreeting";
    greet.textContent = name ? `What's up, ${name}` : "What's up";
    log.appendChild(greet);
    return;
  }
  for (const m of chat.messages) addBubble(m.role, m.content);
}

function render() {
  renderChatList();
  renderLog();
  renderModelSelect();
  renderEffortSelect();
}

// Plugins = slash commands. Two kinds: LOCAL_COMMANDS run entirely client-side
// (no model call, result shown as an "info" bubble); EXPAND_COMMANDS rewrite
// the typed text into a fuller prompt and then send normally.
const LOCAL_COMMANDS = {
  help: {
    desc: "/help - list commands",
    run: () => Object.values(LOCAL_COMMANDS).map((c) => c.desc).concat(Object.values(EXPAND_COMMANDS).map((c) => c.desc)).join("\n"),
  },
  memory: {
    desc: "/memory - show what's remembered across chats",
    run: () => (memory.length ? memory.map((f) => "- " + f).join("\n") : "Nothing remembered yet."),
  },
  remember: {
    desc: "/remember <fact> - save a fact across all chats",
    run: (args) => {
      if (!args) return "Usage: /remember <fact>";
      return addMemoryFact(args) ? `Remembered: ${args}` : "Already remembered.";
    },
  },
  forget: {
    desc: "/forget <keyword|all> - remove remembered fact(s)",
    run: (args) => {
      if (!args) return "Usage: /forget <keyword|all>";
      const n = forgetMemory(args);
      return n > 0 ? `Forgot ${n} fact(s).` : "No matching facts.";
    },
  },
};

const EXPAND_COMMANDS = {
  explain: { desc: "/explain <code> - explain what code does", expand: (args) => `Explain what this Luau code does, step by step:\n${args}` },
  fix: { desc: "/fix <code> - find and fix bugs", expand: (args) => `Find and fix bugs in this Luau code, and explain the fix:\n${args}` },
};

function apiMessages(chat) {
  return chat.messages.filter((m) => m.role === "user" || m.role === "assistant");
}

function addBubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  document.getElementById("log").appendChild(div);
  div.scrollIntoView();
  return div;
}

async function send() {
  const promptBox = document.getElementById("prompt");
  const sendBtn = document.getElementById("send");
  const raw = promptBox.value.trim();
  if (!raw) return;

  let chat = getActiveChat();
  if (!chat) { newChat(); chat = getActiveChat(); }

  let text = raw;
  if (raw.startsWith("/")) {
    const spaceIdx = raw.indexOf(" ");
    const cmd = (spaceIdx === -1 ? raw.slice(1) : raw.slice(1, spaceIdx)).toLowerCase();
    const args = spaceIdx === -1 ? "" : raw.slice(spaceIdx + 1).trim();
    if (LOCAL_COMMANDS[cmd]) {
      promptBox.value = "";
      chat.messages.push({ role: "info", content: LOCAL_COMMANDS[cmd].run(args) });
      persist();
      render();
      return;
    }
    if (EXPAND_COMMANDS[cmd]) {
      text = EXPAND_COMMANDS[cmd].expand(args);
    } else {
      promptBox.value = "";
      chat.messages.push({ role: "info", content: `Unknown command: /${cmd}. Try /help.` });
      persist();
      render();
      return;
    }
  }

  promptBox.value = "";
  sendBtn.disabled = true;
  chat.messages.push({ role: "user", content: text });
  if (chat.title === "New chat") chat.title = raw.slice(0, 40);
  persist();
  render();
  const assistantDiv = addBubble("assistant", "");

  try {
    const res = await fetch("http://localhost:11434/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: getModel(chat).ollama, messages: apiMessages(chat), system: buildSystemPrompt(chat), options: getEffort(chat).options, stream: true }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = "";
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const chunk = JSON.parse(line);
        full += chunk.message?.content || "";
        assistantDiv.textContent = full;
        assistantDiv.scrollIntoView();
      }
    }
    chat.messages.push({ role: "assistant", content: full });
    persist();
    maybeExtractMemory(getModel(chat).ollama, text, full);
  } catch (e) {
    assistantDiv.textContent = "Error: " + e.message + "\n(Is `ollama serve` running?)";
  } finally {
    sendBtn.disabled = false;
    promptBox.focus();
  }
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
document.getElementById("newChatBtn").addEventListener("click", newChat);

const overlay = document.getElementById("settingsOverlay");
document.getElementById("settingsBtn").addEventListener("click", () => {
  document.getElementById("setEnthusiasm").value = settings.enthusiasm;
  document.getElementById("setEmojis").value = settings.emojis;
  document.getElementById("setSarcasm").value = settings.sarcasm;
  overlay.classList.add("open");
});
document.getElementById("closeSettings").addEventListener("click", () => overlay.classList.remove("open"));
for (const [key, id] of [["enthusiasm", "setEnthusiasm"], ["emojis", "setEmojis"], ["sarcasm", "setSarcasm"]]) {
  document.getElementById(id).addEventListener("change", (e) => {
    settings[key] = e.target.value;
    saveSettings(settings);
  });
}

document.getElementById("loginSubmit").addEventListener("click", submitLogin);
document.getElementById("loginName").addEventListener("keydown", (e) => { if (e.key === "Enter") submitLogin(); });

document.getElementById("modelSelect").addEventListener("change", (e) => {
  currentModelId = e.target.value;
  localStorage.setItem("luau_current_model_id", currentModelId);
  const chat = getActiveChat();
  if (chat) { chat.model = currentModelId; persist(); }
});
document.getElementById("effortSelect").addEventListener("change", (e) => {
  currentEffortId = e.target.value;
  localStorage.setItem("luau_current_effort_id", currentEffortId);
  const chat = getActiveChat();
  if (chat) { chat.effort = currentEffortId; persist(); }
});
document.getElementById("agentSelect").addEventListener("change", (e) => {
  currentAgentId = e.target.value;
  localStorage.setItem("luau_current_agent_id", currentAgentId);
});
const agentsOverlay = document.getElementById("agentsOverlay");
document.getElementById("agentsBtn").addEventListener("click", () => {
  renderAgentList();
  agentsOverlay.classList.add("open");
});
document.getElementById("closeAgents").addEventListener("click", () => agentsOverlay.classList.remove("open"));
document.getElementById("addAgent").addEventListener("click", () => {
  const nameInput = document.getElementById("newAgentName");
  const promptInput = document.getElementById("newAgentPrompt");
  const name = nameInput.value.trim();
  const prompt = promptInput.value.trim();
  if (!name || !prompt) return;
  agents.push({ id: crypto.randomUUID(), name, prompt });
  saveAgents(agents);
  nameInput.value = "";
  promptInput.value = "";
  renderAgentList();
  renderAgentSelect();
});

if (!activeChatId || !getActiveChat()) {
  if (chats.length) activeChatId = chats[0].id;
  else newChat();
}
render();
renderGreeting();
renderAgentSelect();
if (!loadUsername()) showLogin();
</script>
</body>
</html>
